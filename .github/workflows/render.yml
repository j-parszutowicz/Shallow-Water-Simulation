name: Render Quarto PDF Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib numba PyMPDATA matplotlib-inline jupyter

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX (LaTeX for PDF)
        uses: quarto-dev/quarto-actions/install-tinytex@v2

      - name: Render Quarto Report to PDF
        run: |
          quarto render sws.ipynb --execute --to pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sws-report
          path: sws.pdf
          if-no-files-found: error
